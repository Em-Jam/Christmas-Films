<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Film Countdown</title>
<meta name="theme-color" content="#0E2A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Film Countdown">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E2A2B; --fir:#1D4B45; --fir-2:#255a53; --frost:#EAF2EF; --frost-dim:#a9c2bc;
  --gold:#E2B65A; --red:#B3243B; --plum:#6A2F52;
  --t-elite:#E2B65A; --t-top:#D2475C; --t-xmas:#5FB38A; --t-badgood:#B572A0;
  --t-winter:#8EC5E6; --t-undecided:#9aa9a6; --t-dwa:#5d6b69;
  --r-s:6px; --r-m:12px; --r-l:20px;
  --serif:"Young Serif", Georgia, serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--frost);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--frost-dim)}
.small{font-size:.86rem}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--night) 70%,rgba(14,42,43,0));padding:calc(14px + var(--safe-t)) 0 14px}
.top .wrap{display:flex;align-items:center;gap:12px}
.count{flex:1}
.count b{font-family:var(--serif);font-weight:400;font-size:2.4rem;color:var(--gold);line-height:1;margin-right:.3rem}
.count span{font-size:1rem}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--fir-2);background:transparent;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn{position:relative}
.sync-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--t-undecided);border:2px solid var(--night)}
.sync-dot.ok{background:var(--t-xmas)} .sync-dot.err{background:var(--red)} .sync-dot.busy{background:var(--gold)}

/* tonight */
.logbar{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;margin:2px 0 14px;padding:12px 16px 12px 12px;border-radius:var(--r-l);border:1.5px solid var(--gold);background:transparent}
.logbar svg{width:24px;height:24px;color:var(--gold);justify-self:center}
.logbar b{font-size:1.05rem}
.subh{font-size:.9rem;color:var(--frost-dim);margin:16px 0 2px}
.tonight{position:relative;margin-top:6px;border-radius:var(--r-l);background:var(--fir);overflow:hidden;display:grid;grid-template-columns:132px 1fr;gap:16px;padding:16px}
.tonight .poster{width:132px;aspect-ratio:2/3;border-radius:var(--r-m)}
.tonight .pp{border:0;padding:0;background:none;align-self:start}
.tonight .date{font-size:.9rem;color:var(--gold)}
.tonight h2{margin:4px 0 8px}
.tonight .why{font-size:.92rem;color:var(--frost-dim);margin-top:8px}
.tonight .acts{grid-column:1/-1;display:flex;gap:10px}
.tonight.done{grid-template-columns:72px 1fr}
.tonight.done .poster{width:72px}
.btn{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--fir-2);background:transparent;font-weight:700}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#2a1d05}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.grow{flex:1}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--gold);padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px}

.poster{display:block;background:var(--fir-2) center/cover no-repeat;position:relative;overflow:hidden;flex:none}
.poster img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px;font-family:var(--serif);font-size:.8rem;line-height:1.15;color:var(--frost);background:repeating-linear-gradient(135deg,var(--fir-2) 0 10px,#2a6158 10px 20px)}

/* pills */
.tier{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;background:rgba(255,255,255,.07);white-space:nowrap}
.tier::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.svc{display:inline-block;font-size:.82rem;color:var(--frost-dim);border:1px solid var(--fir-2);border-radius:999px;padding:2px 9px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none;margin:18px -18px 0;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--fir-2);background:transparent;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--frost);color:var(--night);border-color:var(--frost);font-weight:700}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}

/* advent grid */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px;gap:10px}
.advent{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:430px){.advent{grid-template-columns:repeat(5,1fr)}}
.door{position:relative;border-radius:var(--r-s);background:var(--fir);border:0;padding:0;aspect-ratio:2/3;overflow:hidden;text-align:left}
.door .poster{position:absolute;inset:0;width:100%;height:100%}
.door .num{position:absolute;left:0;top:0;z-index:2;font-family:var(--serif);font-size:1.25rem;line-height:1;padding:6px 8px 8px 7px;background:var(--night);border-bottom-right-radius:var(--r-s);color:var(--frost)}
.door .num small{display:block;font-family:var(--sans);font-size:.62rem;color:var(--frost-dim);margin-top:2px}
.door .stack{position:absolute;right:5px;bottom:5px;z-index:2;background:var(--night);border-radius:999px;font-size:.72rem;font-weight:700;padding:1px 7px}
.door .band{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c);z-index:2}
.door.xmas-day{outline:2px solid var(--gold);outline-offset:-2px}
.door.xmas-day .num{background:var(--gold);color:#2a1d05}
.door.xmas-day .num small{color:#5a4410}
.door.empty{background:transparent;border:1px dashed var(--fir-2)}
.door.past{opacity:.35}

.progress{height:8px;border-radius:999px;background:var(--fir);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--gold);border-radius:999px}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid rgba(255,255,255,.06)}
.row .poster{width:52px;aspect-ratio:2/3;border-radius:var(--r-s)}
.row .t{font-weight:700;line-height:1.25}
.row .s{font-size:.86rem;color:var(--frost-dim);margin-top:3px}
.tick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--t-xmas);color:var(--night)}
.tick svg{width:16px;height:16px}
.group-h{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.group-h .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.group-h h3{flex:1}

.search{display:flex;gap:8px;margin-top:6px}
.search input{flex:1;min-width:0;min-height:50px;border-radius:999px;border:1px solid var(--fir-2);background:var(--fir);padding:0 20px}
.search input::placeholder{color:var(--frost-dim)}

.card{background:var(--fir);border-radius:var(--r-m);padding:16px}
.card + .card{margin-top:10px}
.empty-state{padding:26px 18px;text-align:center;border:1px dashed var(--fir-2);border-radius:var(--r-m);margin-top:16px}
.empty-state p + .btn{margin-top:14px}

/* stats */
.bignums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bignums div{background:var(--fir);border-radius:var(--r-m);padding:14px 12px}
.bignums b{display:block;font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1;color:var(--gold)}
.bignums span{font-size:.84rem;color:var(--frost-dim)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:112px 1fr 38px;align-items:center;gap:10px;font-size:.92rem}
.barrow .track{height:14px;border-radius:999px;background:var(--fir);overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--c,var(--gold));border-radius:999px}
.barrow .n{text-align:right;font-weight:700}
.warn{border-left:4px solid var(--red)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,32,33,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--frost-dim);text-decoration:none;font-size:.78rem}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,14,14,.6);display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--night);border-top-left-radius:var(--r-l);border-top-right-radius:var(--r-l);border-top:1px solid var(--fir-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + var(--safe-b))}
.sheet.open{transform:none}
.sheet .wrap{padding-top:10px}
.sheetbar{position:sticky;top:0;z-index:3;display:flex;justify-content:center;align-items:center;height:44px;margin:-10px -18px 8px;background:var(--night)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--fir-2)}
.sheetbar .close{position:absolute;right:14px;top:4px}
.sheet .head{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.sheet .head .poster{width:110px;aspect-ratio:2/3;border-radius:var(--r-m)}
.sheet .blk{margin-top:22px}
.sheet .blk > h3{margin-bottom:10px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--fir-2);background:transparent;font-size:.92rem}
.choice .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:0}
.choice[aria-pressed="true"]{background:var(--frost);color:var(--night);border-color:var(--frost);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:.9rem;font-weight:700}
.field input,.field textarea,.field select{min-height:48px;border-radius:var(--r-m);border:1px solid var(--fir-2);background:var(--fir);padding:10px 14px}
.field textarea{min-height:80px;resize:vertical}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input{flex:1;min-width:140px}
.watch-log{display:flex;flex-direction:column}
.watch-log div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--fir-2);background:transparent;display:grid;place-items:center}
.x svg{width:14px;height:14px}
.steps{margin:10px 0 0;padding-left:22px}
.steps li{margin-bottom:6px}
.status{font-size:.88rem;margin-top:8px;color:var(--frost-dim)}
.status.err{color:#ff8f9c}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--frost);color:var(--night);border-radius:999px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;font-weight:700;transition:.2s;pointer-events:none;max-width:calc(100% - 28px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;border:0;background:var(--night);color:var(--frost);border-radius:999px;padding:6px 14px;font-weight:700}

.open-door{animation:door .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}
@keyframes door{from{transform:perspective(700px) rotateY(-70deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.open-door{animation:none}.sheet,.toast{transition:none}}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="count" id="count"></div>
  <button class="iconbtn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  <span class="sync-dot" id="syncDot" aria-hidden="true"></span></button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Main"><div class="wrap">
  <a href="#tonight" data-tab="tonight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 8.8l6-.7z"/></svg>Tonight</a>
  <a href="#films" data-tab="films"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>My films</a>
  <a href="#discover" data-tab="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>Find films</a>
  <a href="#stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Stats</a>
</div></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="wrap"><div class="sheetbar"><span class="grab"></span><button class="x close" id="sheetClose" aria-label="Close">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sheetBody"></div></div></section>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" class="hidden">Undo</button></div>

/* ---------------- dates ---------------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
function today(){
  const q = new URLSearchParams(location.search).get("today");
  return q && /^\d{4}-\d\d-\d\d$/.test(q) ? q : iso(new Date());
}
const fmt = (s, o={weekday:"short", day:"numeric", month:"short"}) => parse(s).toLocaleDateString("en-GB", o);

/* Season runs July→June so a December season isn't split by New Year. */
function season(t = today()){
  const y = +t.slice(0,4), md = t.slice(5);
  const startMD = data.seasonStart || "11-15";
  if (md <= "01-05") return {mode:"after", year:y-1, end:`${y}-01-05`};
  if (md >= "12-26") return {mode:"after", year:y, end:`${y+1}-01-05`};
  if (md < startMD) return {mode:"before", year:y, start:`${y}-${startMD}`, end:`${y}-12-25`};
  return {mode:"on", year:y, start:t, end:`${y}-12-25`};
}
const inSeason = (w, yr) => w >= `${yr}-07-01` && w <= `${yr+1}-06-30`;
const watchedThisSeason = (f, yr = season().year) => f.watches.some(w => inSeason(w, yr));
const lastWatch = f => f.watches.length ? f.watches[f.watches.length-1] : null;

/* ---------------- planning ---------------- */
function rankWithinTier(a, b){
  // films you've come back to most often first, then the longest since last watch
  if (b.watches.length !== a.watches.length) return b.watches.length - a.watches.length;
  const la = lastWatch(a) || "", lb = lastWatch(b) || "";
  if (la !== lb) return la < lb ? -1 : 1;
  return a.title.localeCompare(b.title);
}
function buildPlan(service = ui.service){
  const t = today(), s = season(t);
  let pool, order, start, end;
  if (s.mode === "after"){
    order = ["winter"]; start = t; end = s.end;
  } else {
    order = PLAN_ORDER; start = s.mode === "before" ? s.start : t; end = s.end;
  }
  pool = data.films.filter(f => order.includes(f.tier) && !watchedThisSeason(f, s.year) && (!service || f.service === service));
  const skipToday = f => data.skips[f.id] === t;
  pool.sort((a,b) => (order.indexOf(a.tier) - order.indexOf(b.tier)) || rankWithinTier(a,b));
  // films skipped tonight move to the back of their tier
  pool.sort((a,b) => (order.indexOf(a.tier) - order.indexOf(b.tier)) || (skipToday(a) - skipToday(b)));
  const days = Math.max(1, diffDays(start, end) + 1);
  // Running out of nights? Keep the best films (max 2 a night) and drop the lowest tiers first.
  const capacity = days * 2;
  let dropped = 0;
  if (pool.length > capacity){
    dropped = pool.length - capacity;
    pool = pool.slice(dropped);
  }
  const slots = Array.from({length:days}, (_, i) => ({date:addDays(start, i), films:[]}));
  const n = pool.length;
  pool.forEach((f, i) => { slots[Math.min(days-1, Math.floor(i * days / n))].films.push(f); });
  return {season:s, start, end, days, slots, pool, dropped};
}

/* ---------------- TMDB ---------------- */
async function tmdb(path, params = {}){
  const key = (data.tmdbKey || "").trim();
  if (!key) throw new Error("Add your TMDB key in Settings first.");
  const u = new URL("https://api.themoviedb.org/3" + path);
  const headers = {accept:"application/json"};
  if (key.length > 60) headers.Authorization = "Bearer " + key; else u.searchParams.set("api_key", key);
  u.searchParams.set("language", "en-GB");
  for (const [k,v] of Object.entries(params)) if (v != null && v !== "") u.searchParams.set(k, v);
  const r = await fetch(u, {headers});
  if (r.status === 401) throw new Error("TMDB didn't accept that key. Check it in Settings.");
  if (!r.ok) throw new Error("TMDB request failed (" + r.status + ").");
  return r.json();
}
function applyMovie(f, m){
  f.tmdbId = m.id; f.poster = m.poster_path || null;
  f.year = m.release_date ? +m.release_date.slice(0,4) : f.year;
  f.genres = m.genre_ids || (m.genres || []).map(g => g.id);
  f.overview = m.overview || "";
}
async function findMatch(f){
  const q = f.searchQuery || f.title;
  let r = await tmdb("/search/movie", {query:q, year:f.searchYear || ""});
  if (!r.results.length && f.searchYear) r = await tmdb("/search/movie", {query:q});
  return r.results[0] || null;
}
async function matchAll(onProgress){
  const todo = data.films.filter(f => !f.tmdbId);
  let done = 0, missed = [];
  for (const f of todo){
    try { const m = await findMatch(f); if (m) applyMovie(f, m); else missed.push(f.title); }
    catch (e){ if (/key/.test(e.message)) throw e; missed.push(f.title); }
    done++; onProgress && onProgress(done, todo.length);
    await new Promise(r => setTimeout(r, 120));
  }
  touch();
  return missed;
}
const PROVIDER_MAP = [[/netflix/i,"Netflix"],[/disney/i,"Disney+"],[/amazon|prime video/i,"Amazon Prime"],[/sky|now tv|^now$/i,"Sky"]];
async function providers(tmdbId){
  const c = cache.providers[tmdbId];
  if (c && Date.now() - c.at < 3 * 864e5) return c.list;
  const r = await tmdb(`/movie/${tmdbId}/watch/providers`);
  const gb = (r.results && r.results.GB) || {};
  const list = (gb.flatrate || []).map(p => p.provider_name);
  cache.providers[tmdbId] = {at:Date.now(), list}; saveCache();
  return list;
}
function mapService(list){
  for (const name of list) for (const [re, s] of PROVIDER_MAP) if (re.test(name)) return s;
  return "Other";
}
async function genreNames(){
  if (cache.genres) return cache.genres;
  const r = await tmdb("/genre/movie/list");
  cache.genres = Object.fromEntries(r.genres.map(g => [g.id, g.name])); saveCache();
  return cache.genres;
}

/* New releases: this year's Christmas films, ranked against what you rate highly */
async function loadNewReleases(force){
  const t = today(), yr = season(t).year;
  if (!force && cache.newRel && cache.newRel.day === t && cache.newRel.year === yr) return cache.newRel.items;
  const names = await genreNames();
  const kwIds = [];
  for (const q of ["christmas", "santa claus", "christmas eve"]){
    const k = await tmdb("/search/keyword", {query:q});
    const hit = k.results.find(x => x.name.toLowerCase() === q);
    if (hit) kwIds.push(hit.id);
  }
  const found = new Map();
  for (const page of [1,2,3]){
    const r = await tmdb("/discover/movie", {with_keywords:kwIds.join("|"), "primary_release_date.gte":`${yr}-01-01`,
      "primary_release_date.lte":`${yr}-12-31`, sort_by:"popularity.desc", include_adult:"false", page});
    r.results.forEach(m => found.set(m.id, m));
    if (page >= r.total_pages) break;
  }
  // taste profile from your tiers
  const W = {elite:3, top:2, xmas:1.5, badgood:1, winter:.5, undecided:0, dwa:-2};
  const prof = {};
  data.films.forEach(f => (f.genres || []).forEach(g => prof[g] = (prof[g] || 0) + (W[f.tier] || 0)));
  const maxP = Math.max(1, ...Object.values(prof));
  // "people who liked your favourites also liked..."
  const fav = data.films.filter(f => f.tmdbId && (f.tier === "elite" || f.tier === "top")).sort(rankWithinTier).slice(0, 8);
  const recHits = {};
  for (const f of fav){
    try {
      const r = await tmdb(`/movie/${f.tmdbId}/recommendations`);
      r.results.forEach(m => (recHits[m.id] = recHits[m.id] || []).push(f.title));
    } catch {}
  }
  const mine = new Set(data.films.map(f => f.tmdbId).filter(Boolean));
  const items = [...found.values()].filter(m => !mine.has(m.id)).map(m => {
    const g = m.genre_ids || [];
    const taste = g.length ? g.reduce((s, id) => s + (prof[id] || 0), 0) / g.length / maxP : 0;
    const recs = recHits[m.id] || [];
    const score = taste * 10 + recs.length * 6 + Math.log10(1 + (m.popularity || 0)) * 2 + (m.vote_average || 0) * .3;
    let reason;
    if (recs.length) reason = "Recommended for fans of " + recs.slice(0,2).join(" and ");
    else {
      const top = g.filter(id => prof[id] > 0).sort((a,b) => prof[b] - prof[a]).slice(0,2).map(id => names[id]).filter(Boolean);
      reason = top.length ? top.join(" and ") + ", like the films you rate highly" : "New Christmas release this year";
    }
    return {id:m.id, title:m.title, year:m.release_date ? +m.release_date.slice(0,4) : yr, release:m.release_date || "",
      poster:m.poster_path, overview:m.overview, genre_ids:g, score, reason};
  }).sort((a,b) => b.score - a.score);
  cache.newRel = {day:t, year:yr, items}; saveCache();
  return items;
}

let pushTimer = null, syncState = "off", syncMsg = "Not set up";
function setSync(state, msg){
  syncState = state; syncMsg = msg;
  const dot = document.getElementById("syncDot");
  dot.className = "sync-dot " + ({ok:"ok", err:"err", busy:"busy"}[state] || "");
  const el = document.getElementById("syncStatus");
  if (el){ el.textContent = msg; el.className = "status" + (state === "err" ? " err" : ""); }
}
async function gh(path, opts = {}){
  const r = await fetch("https://api.github.com" + path, {...opts, headers:{
    Authorization:"Bearer " + secrets.ghToken, Accept:"application/vnd.github+json", "Content-Type":"application/json"}});
  if (r.status === 401) throw new Error("GitHub didn't accept that token.");
  if (!r.ok) throw new Error("GitHub request failed (" + r.status + ").");
  return r.json();
}
async function readRemote(){
  const g = await gh("/gists/" + secrets.gistId);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return JSON.parse(text);
}
async function push(){
  await gh("/gists/" + secrets.gistId, {method:"PATCH", body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
}
async function syncNow(firstLink = false){
  if (!secrets.ghToken){ setSync("off", "Not set up"); return; }
  setSync("busy", "Syncing…");
  try {
    let adopted = false;
    if (!secrets.gistId){
      const list = await gh("/gists?per_page=100");
      const g = list.find(x => x.description === GIST_DESC);
      if (g){ secrets.gistId = g.id; firstLink = true; }
      else {
        const c = await gh("/gists", {method:"POST", body:JSON.stringify({description:GIST_DESC, public:false,
          files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
        secrets.gistId = c.id;
      }
      saveSecrets();
    }
    const remote = await readRemote();
    if (remote && Array.isArray(remote.films) && (firstLink || remote.updatedAt > data.updatedAt)){
      const key = data.tmdbKey;
      data = remote; if (!data.tmdbKey && key) data.tmdbKey = key;
      store.set("cfc.data", data); adopted = true;
    } else if (!remote || remote.updatedAt < data.updatedAt){
      await push();
    }
    setSync("ok", "Synced at " + new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}));
    if (adopted) render();
  } catch (e){ setSync("err", e.message); }
}
function schedulePush(){
  if (!secrets.ghToken || !secrets.gistId) return;
  clearTimeout(pushTimer);
  setSync("busy", "Saving…");
  pushTimer = setTimeout(async () => {
    try { await push(); setSync("ok", "Synced at " + new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"})); }
    catch (e){ setSync("err", e.message); }
  }, 1500);
}

const seasonOf = w => { const y = +w.slice(0,4); return w.slice(5) < "07-01" ? y-1 : y; };
function seasonYears(){
  const cur = season().year;
  const ys = new Set(data.films.flatMap(f => f.watches.map(seasonOf)));

  return [...ys].filter(y => y <= cur).sort((a,b) => b - a);

function renderStats(){
  const cur = season().year, years = seasonYears();
  const yr = years.includes(ui.statsYear) ? ui.statsYear : cur;
  const isCur = yr === cur;
  const watchedIn = f => watchedThisSeason(f, yr);
  const perYear = [...years].sort().map(y => [y, data.films.reduce((n, f) => n + f.watches.filter(w => inSeason(w, y)).length, 0)]);
  const maxY = Math.max(1, ...perYear.map(x => x[1]));
  const seen = data.films.filter(watchedIn);
  const nights = data.films.reduce((n, f) => n + f.watches.filter(w => inSeason(w, yr)).length, 0);
  const elite = data.films.filter(f => f.tier === "elite");
  const eliteSeen = elite.filter(watchedIn).length;
  const missing = data.films.filter(f => (f.tier === "elite" || f.tier === "top") && !watchedIn(f))
    .sort((a,b) => (a.tier === b.tier ? rankWithinTier(a,b) : a.tier === "elite" ? -1 : 1));
  const most = [...data.films].sort((a,b) => b.watches.length - a.watches.length).filter(f => f.watches.length > 1).slice(0, 5);

  let out = `<h2 style="margin-top:4px">${isCur ? "This season" : yr + " season"}</h2>

    <p class="muted small" style="margin-top:10px">A season runs from July to June, so a film watched on New Year's Day still counts towards that Christmas. Only ${yr} watches are counted here.</p>
    <div class="bignums" style="margin-top:14px"><div><b>${nights}</b><span>films watched</span></div>
    <div><b>${seen.length}</b><span>different films</span></div>
    <div><b>${isCur ? elite.length - eliteSeen : eliteSeen + "/" + elite.length}</b><span>${isCur ? "Elite still to watch" : "Elite watched"}</span></div></div>`;
  if (isCur && missing.length){
    out += `<div class="card warn" style="margin-top:16px"><h3>Don't miss these</h3>
      <p class="muted small" style="margin-top:4px">Elite and Top films you haven't watched this season.</p>
      <div class="list" style="margin-top:6px">${missing.map(rowHTML).join("")}</div></div>`;
  }
  out += `<div class="section-h"><h2>By tier in ${yr}</h2></div><div class="bars">${TIERS.map(t => {
    const all = data.films.filter(f => f.tier === t.id); if (!all.length) return "";
    const w = all.filter(watchedIn).length;
    return `<div class="barrow"><span>${esc(t.name)}</span><span class="track"><i style="--c:${t.c};width:${Math.round(w/all.length*100)}%"></i></span><span class="n">${w}/${all.length}</span></div>`;

  out += `<div class="section-h"><h2>Films watched per season</h2></div><div class="bars">${perYear.map(([y,n]) =>
    `<div class="barrow"><span>${y}</span><span class="track"><i style="width:${Math.round(n/maxY*100)}%;${y === yr ? "" : "opacity:.45"}"></i></span><span class="n">${n}</span></div>`).join("")}</div>`;
  if (isCur && most.length) out += `<div class="section-h"><h2>Most rewatched</h2></div><div class="list">${most.map(rowHTML).join("")}</div>`;
  return out;
}

let logTimer = null, logSeq = 0;
function openLog(){
  sheetCtx = {kind:"log", q:"", tmdb:null, tmdbErr:""};

    <div class="search" style="margin-top:14px"><input id="logQ" type="search" placeholder="Search your films or any film" aria-label="Search films" autocomplete="off" enterkeyhint="search"></div>

}
function drawLogResults(){
  const c = sheetCtx, el = document.getElementById("logResults"); if (!el || c.kind !== "log") return;
  const q = c.q.trim().toLowerCase();
  let out = "";
  if (!q){
    const recent = [...data.films].filter(f => f.watches.length).sort((a,b) => (lastWatch(b) > lastWatch(a) ? 1 : -1)).slice(0, 6);
    const plan = buildPlan("").slots.flatMap(x => x.films).slice(0, 4);
    out += `<p class="subh">Up next in your countdown</p><div class="list">${plan.map(logRowMine).join("")}</div>`;
    if (recent.length) out += `<p class="subh">Recently watched</p><div class="list">${recent.map(logRowMine).join("")}</div>`;
    return el.innerHTML = out;
  }
  const mine = data.films.filter(f => f.title.toLowerCase().includes(q) || (f.sheetName || "").toLowerCase().includes(q)).slice(0, 8);
  out += `<p class="subh">In your films</p>` + (mine.length ? `<div class="list">${mine.map(logRowMine).join("")}</div>` : `<p class="muted small" style="padding:6px 0">None of your films match.</p>`);
  if (!data.tmdbKey) out += `<p class="muted small" style="margin-top:14px">Add a TMDB key in Settings to search for films that aren't on your list yet.</p>`;
  else {
    out += `<p class="subh">New to your list</p>`;
    if (c.tmdbErr) out += `<p class="status err">${esc(c.tmdbErr)}</p>`;
    else if (!c.tmdb || c.tmdb.q !== c.q) out += `<p class="muted small" style="padding:6px 0">Searching TMDB…</p>`;
    else {
      const have = new Set(data.films.map(f => f.tmdbId));
      const norm = t => (t || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      const mineKey = new Set(data.films.map(f => norm(f.title) + "|" + (f.year || "")));
      const mineTitle = new Set(data.films.filter(f => !f.year).map(f => norm(f.title)));
      const res = c.tmdb.results.filter(m => !have.has(m.id) && !mineKey.has(norm(m.title) + "|" + (m.release_date || "").slice(0,4)) && !mineTitle.has(norm(m.title))).slice(0, 8);
      out += res.length ? `<div class="list">${res.map(m => `<button class="row" data-logtmdb="${m.id}">${posterHTML(m.poster_path, m.title, "w92")}
        <span><span class="t">${esc(m.title)}${m.release_date ? ` (${m.release_date.slice(0,4)})` : ""}</span><span class="s" style="display:block">${esc((m.overview || "").slice(0, 80))}${(m.overview || "").length > 80 ? "…" : ""}</span></span><span class="svc">New</span></button>`).join("")}</div>`
        : `<p class="muted small" style="padding:6px 0">No other films found.</p>`;
    }
  }
  el.innerHTML = out;
}
function logRowMine(f){
  return `<button class="row" data-logpick="${f.id}">${posterHTML(f.poster, f.title, "w92")}
    <span><span class="t">${esc(f.title)}</span><span class="s" style="display:block">${esc(TIER[f.tier].name)}. ${esc(watchedLine(f))}</span></span>
    ${watchedThisSeason(f) ? `<span class="tick" title="Watched this season">${check}</span>` : "<span></span>"}</button>`;
}
function onLogQuery(v){
  const c = sheetCtx; c.q = v; c.tmdbErr = ""; drawLogResults();
  clearTimeout(logTimer);
  if (!data.tmdbKey || v.trim().length < 2) return;
  const seq = ++logSeq;
  logTimer = setTimeout(async () => {
    try {
      const r = await tmdb("/search/movie", {query:v.trim()});
      if (seq !== logSeq || !sheetCtx || sheetCtx.kind !== "log") return;
      sheetCtx.tmdb = {q:v, results:r.results};
    } catch (e){ if (sheetCtx && sheetCtx.kind === "log") sheetCtx.tmdbErr = e.message; }
    drawLogResults();
  }, 350);
}
function openLogFilm(opts){
  const back = sheetCtx && sheetCtx.kind === "log" ? {q:sheetCtx.q, tmdb:sheetCtx.tmdb} : null;
  if (opts.filmId){
    const f = byId(opts.filmId);
    sheetCtx = {kind:"logfilm", filmId:f.id, tier:f.tier, service:f.service, date:today(), back};
  } else {
    const m = (back && back.tmdb ? back.tmdb.results : []).find(x => x.id === opts.tmdbId) || {id:opts.tmdbId, title:""};
    const dup = data.films.find(f => f.tmdbId === m.id);
    if (dup) return openLogFilm({filmId:dup.id});
    sheetCtx = {kind:"logfilm", movie:m, tier:"undecided", service:"", date:today(), back};
    Promise.all([tmdb(`/movie/${m.id}`), providers(m.id)]).then(([det, list]) => {
      if (!sheetCtx || sheetCtx.movie !== m) return;
      sheetCtx.movie = det; if (!sheetCtx.service) sheetCtx.service = mapService(list); sheetCtx.list = list; drawLogFilm();
    }).catch(() => {});
  }
  drawLogFilm();
}
function drawLogFilm(){
  const c = sheetCtx, f = c.filmId ? byId(c.filmId) : null, m = c.movie || {};
  const title = f ? f.title : m.title, poster = f ? f.poster : m.poster_path;
  const yr = f ? f.year : (m.release_date ? m.release_date.slice(0,4) : "");
  const cur = season().year, ly = seasonOf(c.date); c._ly = ly;
  const sub = f ? `${esc(watchedLine(f))}${watchedThisSeason(f) ? ". Already watched this season" : ""}` : `New to your list${c.list ? (c.list.length ? ". UK streaming: " + esc(c.list.join(", ")) : "") : ""}`;
  openSheet(`${c.back ? `<button class="linkbtn" data-action="logBack" style="margin-bottom:10px">Back to search</button>` : ""}
    <div class="head">${posterHTML(poster, title || "")}
    <div><h2>${esc(title || "")}</h2><p class="muted" style="margin-top:6px">${esc(yr || "")}</p><p class="small muted" style="margin-top:10px">${sub}</p></div></div>
    <div class="blk"><h3>When did you watch it?</h3>
      <div class="choices">${[cur, cur-1, cur-2].map(y => `<button class="choice" data-lgyear="${y}" aria-pressed="${ly === y}">${y === cur ? "This season" : y}</button>`).join("")}</div>
      <div class="inline" style="margin-top:10px"><input type="date" id="lgDate" value="${c.date}" aria-label="Date watched" style="min-height:48px;border-radius:var(--r-m);border:1px solid var(--fir-2);background:var(--fir);padding:0 12px">
      ${c.date !== today() ? `<button class="linkbtn" data-action="lgToday">Tonight</button>` : ""}</div>
      ${ly !== cur ? `<p class="muted small" style="margin-top:8px">Counts towards ${ly} only. This season's stats and plan won't change.</p>` : ""}</div>
    <div class="blk"><h3>${f ? (f.tier === "undecided" ? "Your rating" : "Your rating (change it if you like)") : "Your rating"}</h3><div class="choices">${TIERS.map(t =>
      `<button class="choice" data-lgtier="${t.id}" aria-pressed="${c.tier === t.id}"><span class="dot" style="--c:${t.c}"></span>${esc(t.name)}</button>`).join("")}</div></div>
    <div class="blk"><h3>Where you watched it</h3><div class="choices">${SERVICES.map(sv =>
      `<button class="choice" data-lgsvc="${esc(sv)}" aria-pressed="${c.service === sv}">${esc(sv)}</button>`).join("")}</div></div>
    <div class="blk" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn primary" data-action="lgSave">${f ? "Log watch and save rating" : "Add to my films and log watch"}</button>
      <button class="btn" data-action="lgRateOnly">${f ? "Save rating only" : "Add to my films without logging a watch"}</button></div>`, "Log a watch");
}
function saveLog(logIt){
  const c = sheetCtx;
  const picked = document.getElementById("lgDate");
  if (picked && /^\d{4}-\d\d-\d\d$/.test(picked.value)) c.date = picked.value; let f = c.filmId ? byId(c.filmId) : null; let isNew = false;
  if (!f){
    const m = c.movie; if (!m || !m.title) return toast("Still loading film details. Try again in a moment.");
    f = {id:"t" + m.id, title:m.title, tier:c.tier, service:c.service || "Other", watches:[], tmdbId:null, poster:null, year:null, genres:[], overview:"", notes:"", searchQuery:m.title, searchYear:null};
    applyMovie(f, m); data.films.push(f); isNew = true;
  }
  const prev = {tier:f.tier, service:f.service};
  f.tier = c.tier; f.service = c.service || f.service || "Other";
  const date = c.date;
  if (logIt){ f.watches.push(date); f.watches.sort(); delete data.skips[f.id]; }
  touch(); closeSheet(); render();
  const y = seasonOf(date), parts = [];
  if (logIt) parts.push(y === season().year ? `Logged ${f.title}` : `Logged ${f.title} for ${y}`); else parts.push(isNew ? `Added ${f.title}` : `Saved ${f.title}`);
  if (prev.tier !== f.tier || isNew) parts.push(TIER[f.tier].name);
  toast(parts.join(", "), () => {
    if (isNew){ data.films = data.films.filter(x => x !== f); }
    else { f.tier = prev.tier; f.service = prev.service; if (logIt){ const i = f.watches.lastIndexOf(date); if (i > -1) f.watches.splice(i, 1); } }
    touch(); render();
  });
}

/* ---------------- render + events ---------------- */
function render(){
  renderCount();
  const v = view();
  document.querySelectorAll("nav.tabs a").forEach(a => a.dataset.tab === v ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  const el = document.getElementById("view");
  const focused = document.activeElement && document.activeElement.id;
  el.innerHTML = v === "films" ? renderFilms() : v === "discover" ? renderDiscover() : v === "stats" ? renderStats() : renderTonight();
  if (focused === "libQ"){ const i = document.getElementById("libQ"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (sheetCtx && sheetCtx.kind === "film") drawFilm();
}
window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); });

document.addEventListener("click", async e => {
  const b = e.target.closest("button,[data-open]"); if (!b) return;
  const d = b.dataset;
  if (d.day){
    const sl = buildPlan().slots.find(x => x.date === d.day); if (!sl) return;
    sheetCtx = {kind:"day"};
    return openSheet(`<h2>${fmt(d.day, {weekday:"long", day:"numeric", month:"long"})}</h2>
      <p class="muted small" style="margin-top:6px">${sl.films.length} films planned for this night. Tap one for details.</p>
      <div class="list" style="margin-top:8px">${sl.films.map(rowHTML).join("")}</div>`, "Night plan");
  }
  if (d.open) return openFilm(d.open);
  if (d.watch) return markWatched(byId(d.watch));
  if (d.skip) return skipTonight(byId(d.skip));
  if (d.svc !== undefined && b.classList.contains("chip")){ ui.service = d.svc; return render(); }
  if (d.tierf !== undefined){ ui.tierFilter = d.tierf; return render(); }
  if (d.tmdb) return openAdd(+d.tmdb, !!d.sugg);
  if (d.settier){ const f = byId(sheetCtx.id); f.tier = d.settier; touch(); if (sheetCtx.rate){ closeSheet(); toast(`${f.title} is now ${TIER[f.tier].name}`); render(); return; } return render(); }
  if (d.setsvc){ const f = byId(sheetCtx.id); f.service = d.setsvc; touch(); return render(); }
  if (d.unwatch !== undefined){ const f = byId(sheetCtx.id); f.watches.splice(+d.unwatch, 1); touch(); return render(); }
  if (d.pick){
    const m = sheetCtx.results.find(x => x.id === +d.pick), f = byId(sheetCtx.id);
    applyMovie(f, m); touch(); openFilm(f.id); render(); return;
  }
  if (d.year){ ui.statsYear = +d.year; return render(); }
  if (d.logyear){
    const y = +d.logyear; sheetCtx.logYear = y;
    sheetCtx.logDate = y === season().year ? today() : `${y}-12-15`;
    return drawFilm();
  }
  if (d.logpick) return openLogFilm({filmId:d.logpick});
  if (d.logtmdb) return openLogFilm({tmdbId:+d.logtmdb});
  if (d.lgtier){ sheetCtx.tier = d.lgtier; return drawLogFilm(); }
  if (d.lgsvc){ sheetCtx.service = d.lgsvc; return drawLogFilm(); }
  if (d.lgyear){ const y = +d.lgyear; sheetCtx.date = y === season().year ? today() : `${y}-12-15`; return drawLogFilm(); }
  if (d.addtier){ sheetCtx.tier = d.addtier; return drawAdd(); }
  if (d.addsvc){ sheetCtx.service = d.addsvc; return drawAdd(); }
  switch (d.action){
    case "settings": return openSettings();
    case "openLog": return openLog();
    case "logBack": { const bk = sheetCtx.back; openLog(); if (bk){ sheetCtx.q = bk.q; sheetCtx.tmdb = bk.tmdb; const i = document.getElementById("logQ"); i.value = bk.q; drawLogResults(); } return; }
    case "lgToday": sheetCtx.date = today(); return drawLogFilm();
    case "lgSave": return saveLog(true);
    case "lgRateOnly": return saveLog(false);
    case "logwatch": {
      const v = document.getElementById("watchDate").value || today(); const f = byId(sheetCtx.id);
      f.watches.push(v); f.watches.sort(); touch(); render();
      const y = seasonOf(v);
      return toast(y === season().year ? `Logged ${f.title}` : `Logged ${f.title} for ${y}`, () => { const i = f.watches.lastIndexOf(v); if (i > -1) f.watches.splice(i, 1); touch(); render(); });
    }
    case "rematch": return openRematch();
    case "delete": {
      if (!sheetCtx.confirmDelete){ sheetCtx.confirmDelete = true; return drawFilm(); }
      const i = data.films.findIndex(f => f.id === sheetCtx.id), [gone] = data.films.splice(i, 1);
      closeSheet(); touch(); render();
      return toast(`Removed ${gone.title}`, () => { data.films.splice(i, 0, gone); touch(); render(); });
    }
    case "add": {
      const c = sheetCtx, m = c.movie;
      const f = {id:"t" + m.id, title:m.title, tier:c.tier, service:c.service || "Other", watches:[], tmdbId:null, poster:null, year:null, genres:[], overview:"", notes:"", searchQuery:m.title, searchYear:null};
      applyMovie(f, m); data.films.push(f); touch(); closeSheet(); render();
      return toast(`Added ${f.title} as ${TIER[f.tier].name}`);
    }
    case "hide": data.hidden.push(sheetCtx.tmdbId); touch(); closeSheet(); render(); return;
    case "refreshNew": return fetchNew(true);
    case "saveTmdb": {
      data.tmdbKey = document.getElementById("tmdbKey").value.trim(); touch();
      const st = document.getElementById("tmdbStatus"); st.textContent = "Checking key…"; st.className = "status";
      try { await tmdb("/configuration"); st.textContent = "Key works."; cache.newRel = null; saveCache(); ui.newRel = null; drawSettings(); document.getElementById("tmdbStatus").textContent = "Key works."; render(); }
      catch (err){ st.textContent = err.message; st.className = "status err"; }
      return;
    }
    case "match": {
      const st = document.getElementById("tmdbStatus");
      if (!st) { openSettings(); }
      const s2 = document.getElementById("tmdbStatus");
      b.disabled = true;
      try {
        const missed = await matchAll((n, t) => { s2.textContent = `Finding posters: ${n} of ${t}`; });
        s2.textContent = missed.length ? `Done. No match for: ${missed.join(", ")}. Open those films to search by hand.` : "Done. Every film has a poster.";
        render();
      } catch (err){ s2.textContent = err.message; s2.className = "status err"; }
      b.disabled = false; return;
    }
    case "saveGh": {
      const tok = document.getElementById("ghToken").value.trim();
      if (tok !== secrets.ghToken){ secrets.ghToken = tok; secrets.gistId = ""; saveSecrets(); }
      return syncNow(true);
    }
    case "syncNow": return syncNow();
    case "unlink": secrets = {ghToken:"", gistId:""}; saveSecrets(); setSync("off", "Not set up"); return drawSettings();
    case "export": {
      const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `christmas-films-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); return;
    }
    case "reset": {
      if (!sheetCtx.resetConfirm){ sheetCtx.resetConfirm = true; return drawSettings(); }
      const key = data.tmdbKey; data = freshData(); data.tmdbKey = key; touch(); closeSheet(); render(); return toast("Back to your original sheet data");
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "logQ" && sheetCtx && sheetCtx.kind === "log") onLogQuery(e.target.value);
  if (e.target.id === "lgDate" && sheetCtx && e.target.value){ sheetCtx.date = e.target.value; const ly = seasonOf(e.target.value); if (ly !== sheetCtx._ly){ sheetCtx._ly = ly; drawLogFilm(); } }
  if (e.target.id === "watchDate" && sheetCtx){ sheetCtx.logDate = e.target.value; sheetCtx.logYear = e.target.value ? seasonOf(e.target.value) : null; }
  if (e.target.id === "libQ"){ ui.libQuery = e.target.value; render(); }
  if (e.target.id === "notes" && sheetCtx && sheetCtx.kind === "film"){ const f = byId(sheetCtx.id); f.notes = e.target.value; data.updatedAt = new Date().toISOString(); store.set("cfc.data", data); schedulePush(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "lgDate" && sheetCtx && sheetCtx.kind === "logfilm" && e.target.value){ sheetCtx.date = e.target.value; drawLogFilm(); }
  if (e.target.id === "watchDate" && sheetCtx && e.target.value){ sheetCtx.logDate = e.target.value; sheetCtx.logYear = seasonOf(e.target.value); }
  if (e.target.id === "seasonStart"){ data.seasonStart = e.target.value; touch(); render(); }
  if (e.target.id === "importFile" && e.target.files[0]){
    e.target.files[0].text().then(t => {
      const d = JSON.parse(t); if (!Array.isArray(d.films)) throw new Error();
      data = d; touch(); closeSheet(); render(); toast(`Restored ${d.films.length} films`);
    }).catch(() => toast("That file isn't a Christmas Film Countdown backup"));
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "tmdbForm"){
    ui.searchQ = document.getElementById("tmdbQ").value.trim(); if (!ui.searchQ) return;
    ui.searchErr = "";
    try { const r = await tmdb("/search/movie", {query:ui.searchQ}); ui.searchRes = r.results.slice(0, 15).map(m => ({...m, poster:m.poster_path})); }
    catch (err){ ui.searchErr = err.message; ui.searchRes = null; }
    render();
  }
  if (e.target.id === "rematchForm") runRematch(document.getElementById("rematchQ").value.trim());
});
document.getElementById("scrim").onclick = closeSheet;
document.getElementById("sheetClose").onclick = closeSheet;
document.getElementById("settingsBtn").onclick = openSettings;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && secrets.ghToken) syncNow(); });

render();
if (secrets.ghToken) syncNow(); else setSync("off", "Not set up");
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
